const StatesBlockNA = () => { const { StateBlock } = window.ChurchAIDesignSystem_06db43; return <StateBlock kind="unavailable" title="Admins only" message="Sign in with an admin account to open accounts and draft tools." />; };
function AuthLayout({ children }) {
  const [wide, setWide] = React.useState(innerWidth >= 1000);
  React.useEffect(() => { const f = () => setWide(innerWidth >= 1000); addEventListener("resize", f); return () => removeEventListener("resize", f); }, []);
  if (!wide || !window.AuthArt) return children;
  return <div style={{ flex: 1, width: "100%", maxWidth: 1240, margin: "0 auto", padding: "20px 24px", boxSizing: "border-box", display: "grid", gridTemplateColumns: "minmax(0,1.1fr) minmax(380px,.9fr)", gap: 32, alignItems: "stretch", minHeight: "calc(100svh - 60px)" }}>
    <window.AuthArt /><div style={{ display: "flex", alignItems: "center" }}>{children}</div></div>;
}
// After an in-app move a reload resumes the saved route; flags such as api, as, state and theme stay.
function dropRouteHash() {
  const q = new URLSearchParams(location.hash.slice(1));
  ["r", "t", "step", "mode", "tab", "expert"].forEach(k => q.delete(k));
  const h = q.toString();
  history.replaceState(history.state, "", location.pathname + location.search + (h ? "#" + h : ""));
}
function App(){
  const hp = new URLSearchParams(location.hash.slice(1));
  const PREVIEW = hp.get("preview") === "1";
  if (hp.get("guest") === "1" && !PREVIEW) { try { localStorage.setItem("ca_guest_first", "1"); localStorage.setItem("ca_onboarded", "1"); } catch (x) {} if (!window.CASession.get()) window.CASession.set({ kind: "guest", name: "Guest" }); }

  if (GF && !window.CASession.get()) window.CASession.set({ kind: "guest", name: "Guest" });
  const first = !hp.get("r") && !window.CASession.get();
  const saved = first ? { r: localStorage.getItem("ca_onboarded") ? "welcome" : "intro" } : hp.get("r") ? { r: hp.get("r"), t: hp.get("t") || "karma", m: hp.get("mode"), x: hp.get("expert"), tab: hp.get("tab") } : JSON.parse(localStorage.getItem("ca_public_route") || '{"r":"term","t":"karma"}');
  const LK = window.CAGuard.lockdown();
  const [r, setR] = React.useState((LK && ["month", "graph"].includes(saved.r)) || (GF && !hp.get("r") && ["welcome", "intro"].includes(saved.r)) ? { r: "search" } : saved);
  const go = (route, t, extra) => { if (LK && ["month", "graph"].includes(route)) route = "search"; if (GF && ["welcome", "intro"].includes(route)) route = "search"; const n = { r: route, t: t ?? r.t, ...(extra || {}) }; setR(n); localStorage.setItem("ca_public_route", JSON.stringify(n)); dropRouteHash(); window.scrollTo(0, 0); };
  window.CAGo = go;
  const [session] = useSession();
  const isAdmin = session && session.kind === "admin";
  const [adminTab, setAdminTab] = React.useState(r.tab); React.useEffect(() => { window.CAAdminTabSeen = setAdminTab; }, []);
  const bleed = r.r === "graph" || (r.r === "admin" && adminTab === "draftmap");
  const auth = r.r === "welcome" || r.r === "signin";
  const intro = r.r === "intro";
  const forced = window.CAGuard.forced();
  const fr = forced && forced !== "offline" && ["search", "term", "month", "graph", "admin", "settings"].includes(r.r);
  return <PublicShell route={r.r} go={go} bleed={bleed} bare={auth || intro}>
    <GentlePause route={r.r} />
    {auth && <AuthLayout><AuthScreen key={r.r} go={go} initialTab={r.r === "signin" && r.m !== "register" ? "signin" : "create"} /></AuthLayout>}
    {intro && <OnboardingScreen go={go} />}
    {fr && <window.CAGuard.State kind={forced} />}
    {!fr && r.r === "settings" && <SettingsScreen go={go} />}
    {!fr && r.r === "search" && <SearchScreen open={t => go("term", t)} />}
    {!fr && r.r === "term" && <TermScreen key={r.t} term={r.t} initialExpert={r.x === "1"} back={() => go("search")} />}
    {!fr && r.r === "month" && <MonthlyScreen go={go} />}
    {!fr && r.r === "graph" && <PublicMap />}
    {!fr && r.r === "admin" && (isAdmin ? <AdminScreen tab={r.tab} /> : <div style={{ maxWidth: 520, width: "100%", margin: "0 auto", padding: "48px var(--gutter-phone)", display: "flex", flexDirection: "column", gap: 14 }}><StatesBlockNA /><div style={{ display: "flex", gap: 8 }}><window.ChurchAIDesignSystem_06db43.Button variant="primary" onClick={() => go("signin")}>Sign in</window.ChurchAIDesignSystem_06db43.Button></div></div>)}
    {r.r === "states" && <StatesScreen />}
  </PublicShell>;
}
(window.CAApi ? window.CAApi.ready : Promise.resolve()).then(() => {
  const hp = new URLSearchParams(location.hash.slice(1));

}).then(() => (window.CAHydrate ? window.CAHydrate() : null)).then(() => {

      return;
    }

});
