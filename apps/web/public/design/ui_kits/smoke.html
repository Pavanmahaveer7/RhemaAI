<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Screen smoke test</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--surface-page);color:var(--text-body);font:15px/1.4 var(--font-body)}h1{font:800 32px/1 var(--font-display);color:var(--text-strong);margin:0 0 6px}table{border-collapse:collapse;width:100%;max-width:1200px;margin-top:16px}td,th{padding:7px 10px;border-bottom:1px solid var(--border-subtle);text-align:left;vertical-align:top}th{color:var(--text-muted)}.ok{color:var(--ok-400);font-weight:700}.no{color:var(--danger-400);font-weight:700}code{font:13px var(--font-mono)}#f{position:absolute;left:-9999px;width:390px;height:844px}a{color:var(--lamp-400)}a:hover{color:var(--lamp-300)}</style></head>
<body><h1>Screen smoke test</h1><div id="sum">Running…</div><table><thead><tr><th>Screen</th><th>Result</th><th>Detail</th></tr></thead><tbody id="rows"></tbody></table><iframe id="f"></iframe>
<script>
const P="public/index.html#",Q="pipeline/index.html#";
const R=[["Landing","landing/index.html"],["Search",P+"r=search"],["Search messy",P+"r=search&messy=1"],["Word karma",P+"r=term&t=karma"],["Word missing",P+"r=term&t=zzzz"],["Word expert",P+"r=term&t=salvation&expert=1"],["Word offline",P+"r=term&t=karma&state=offline"],["Monthly",P+"r=month"],["Monthly closed",P+"r=month&closed=1"],["Map",P+"r=graph"],["Onboarding 1",P+"r=intro&step=1"],["Onboarding 2",P+"r=intro&step=2"],["Onboarding 3",P+"r=intro&step=3"],["Onboarding 4",P+"r=intro&step=4"],["Guest start",P+"r=welcome&guest=1"],["Welcome",P+"r=welcome"],["Sign in",P+"r=signin"],["Settings",P+"r=settings&as=member"],["States",P+"r=states"],["Admin accounts",P+"r=admin&tab=accounts&as=admin"],["Admin map draft",P+"r=admin&tab=map&as=admin"],["Admin draft map",P+"r=admin&tab=draftmap&as=admin"],["Admin faith review",P+"r=admin&tab=edits&as=admin"],["Pastor home",Q+"r=home&pco=on"],["Pastor home messy",Q+"r=home&messy=1"],["Check-in",Q+"r=checkin"],["Result steady",Q+"r=result&ck=steady"],["Result hard",Q+"r=result&ck=hard"],["Result failed",Q+"r=result&ck=failed"],["Tracks",Q+"r=tracks&pco=on"],["Pack",Q+"r=pack&pco=on"],["Church apps",Q+"r=integrations&pco=off"],["Sign-in (PCO)",Q+"r=signin"],["Connected church",Q+"r=church&pco=on"],["Inside church app",Q+"r=embed"],["Register",Q+"r=register"],["Reviewer queue",Q+"role=reviewer&r=queue"],["Packet",Q+"role=reviewer&r=review&id=P-0419"],["Alerts",Q+"role=leader&r=alerts"],["Tour","tour/index.html"]];
const f=document.getElementById("f"),tb=document.getElementById("rows");let pass=0;const out=[];
(async()=>{for(const [n,u] of R){const errs=[];await new Promise(res=>{let done=false;const fin=()=>{if(done)return;done=true;res()};
  f.onload=()=>{try{const w=f.contentWindow;w.addEventListener("error",e=>errs.push(e.message));const ce=w.console.error;w.console.error=(...a)=>{const s=a.map(String).join(" ");if(!/Warning:|DevTools|babel|in-browser/i.test(s))errs.push(s.slice(0,160));ce.apply(w.console,a)}}catch(e){}setTimeout(fin,3200)};
  f.src=u+(u.includes("#")?"":"")+(u.includes("?")?"":"");setTimeout(fin,6000)});
  let blank=false,txt=0;try{const d=f.contentDocument;txt=(d.body.innerText||"").trim().length;blank=txt<20&&!/plain/.test(f.contentWindow.location.href)}catch(e){}
  const ok=!errs.length&&!blank;if(ok)pass++;out.push([n,ok,errs[0]||(blank?"blank page":txt+" chars")]);
  const tr=document.createElement("tr");tr.innerHTML=`<td>${n}</td><td class="${ok?"ok":"no"}">${ok?"Pass":"Fail"}</td><td><code>${String(errs[0]||(blank?"blank page":txt+" chars")).replace(/</g,"&lt;")}</code></td>`;tb.appendChild(tr);
  document.getElementById("sum").textContent=`${pass} / ${out.length} passed…`}
 document.getElementById("sum").textContent=`${pass} / ${R.length} passed`;window.__smoke={pass,total:R.length,fails:out.filter(r=>!r[1])};})();
</script></body></html>
