<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rhema.ai beta — quick feedback</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Kalam&display=swap" rel="stylesheet">
<style>
/* ===== CONFIG LIVES IN THE <script> AT THE BOTTOM ===== */
:root{--bg:#0B0F0C;--card:#121812;--raised:#1A221A;--hover:#1E281E;--line:#2A352A;--line2:#3B4A38;--text:#F3F7EE;--body:#DCE3D6;--muted:#A9B3A4;--lamp:#CFDA5C;--lamp-h:#DDE67A;--lamp-p:#B9C447;--lamp-tint:rgba(207,218,92,.12);--clay:#D69A78;--clay-2:#E8B79A;
--display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;--font:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;--hand:"Kalam","Segoe Print",cursive}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--body);font:400 16px/1.5 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--clay)}a:hover{color:var(--clay-2)}
.wrap{min-height:100vh;min-height:100dvh;max-width:600px;margin:0 auto;padding:20px 20px 28px;display:flex;flex-direction:column;gap:24px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.brand{font:800 18px/1 var(--display);color:var(--text);letter-spacing:-.02em;display:flex;align-items:center;gap:8px}.brand span{color:var(--lamp)}
.beta{font:700 11px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--bg);background:var(--clay);padding:4px 8px;border-radius:999px}
.dots{display:flex;gap:6px}.dot{width:8px;height:8px;border-radius:99px;background:var(--line);transition:width .3s,background .3s}.dot.on{width:22px;background:var(--lamp)}.dot.done{background:#6B7530}
#stage{flex:1;display:flex;flex-direction:column}
.q{display:flex;flex-direction:column;gap:18px;animation:in .45s cubic-bezier(.2,.7,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.step{font:700 12px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{font:800 clamp(26px,6vw,34px)/1.12 var(--display);letter-spacing:-.02em;color:var(--text);margin:0;text-wrap:balance}
h1:focus{outline:none}
.help{margin:-6px 0 0;color:var(--muted);font-size:15px;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{min-height:56px;padding:12px 16px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--text);font:700 16px/1.3 var(--font);text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;transition:background .15s,border-color .15s,transform .1s;-webkit-tap-highlight-color:transparent}
.opt:hover{background:var(--hover);border-color:var(--line2)}.opt:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}.opt:active{transform:scale(.99)}
.opt[aria-pressed="true"]{border-color:var(--lamp);background:var(--lamp-tint)}
.oi{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--raised);color:var(--clay);flex:none}
.row5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.row5 .opt{flex-direction:column;justify-content:center;gap:6px;padding:10px 4px;min-height:76px;text-align:center;font-size:13px;font-weight:600;color:var(--body)}
.row5 .opt b{font:800 20px/1 var(--display);color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--body);font:700 15px/1 var(--font);cursor:pointer;transition:background .15s,border-color .15s}
.chip:hover{background:var(--hover)}.chip:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}.chip[aria-pressed="true"]{border-color:var(--lamp);background:var(--lamp-tint);color:var(--text)}.chip:disabled{opacity:.4;cursor:default}
textarea,input[type=email]{width:100%;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--text);font:400 16px/1.5 var(--font);padding:14px 16px}
textarea{min-height:120px;resize:vertical}
textarea:hover,input:hover{border-color:var(--line2)}textarea:focus,input:focus{outline:2px solid var(--lamp);outline-offset:1px;border-color:transparent}
.cnt{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.warn{margin:0;font-size:14px;color:var(--clay-2)}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between}
.btn{height:48px;padding:0 22px;border-radius:999px;border:0;background:var(--lamp);color:var(--bg);font:700 16px/1 var(--font);cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;text-decoration:none;transition:background .15s,transform .1s}
.btn:hover{background:var(--lamp-h);color:var(--bg)}.btn:active{background:var(--lamp-p);transform:scale(.98)}.btn:focus-visible{outline:2px solid var(--text);outline-offset:2px}.btn:disabled{opacity:.4;cursor:default;transform:none}
.ghost{height:48px;padding:0 16px 0 10px;border-radius:999px;border:0;background:none;color:var(--body);font:700 15px/1 var(--font);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.ghost:hover{background:var(--hover);color:var(--text)}.ghost:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.skip{background:none;border:0;color:var(--muted);font:700 14px/1 var(--font);text-decoration:underline;text-underline-offset:3px;cursor:pointer;height:44px;padding:0 10px}
.skip:hover{color:var(--text)}
[hidden]{display:none!important}
.note{font-size:14px;color:var(--muted);margin:0;text-wrap:pretty}
.done{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;animation:in .5s ease}
.hand{font:400 26px/1.3 var(--hand);color:var(--clay-2);margin:0}
@media (prefers-reduced-motion:reduce){.q,.done{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top"><div class="brand">Rhema<span>.ai</span><span class="beta">Beta</span></div><div class="dots" id="dots" aria-hidden="true"></div></div>
  <div id="stage" aria-live="polite"></div>
  <div class="bar" id="bar">
    <button class="ghost" id="back" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Back</button>
    <div style="display:flex;gap:4px;align-items:center"><button class="skip" id="skip" type="button">Skip</button><button class="btn" id="next" type="button">Next</button></div>
  </div>
</main>

<script>
/* =========================================================
   CONFIG — edit these in Cursor
   ========================================================= */
const SURVEY_CONFIG = {
  version: "beta-1",
  // POST endpoint that receives one JSON answer. Leave "" to save in the browser only.
  // e.g. "/api/v1/beta-survey" when wired on the API
  endpoint: "/api/v1/feedback/beta-survey",
  // Where "Back to the app" goes after sending
  appUrl: "/app",
  // Extra headers for the POST (e.g. Supabase anon key)
  headers: {}
};

/* Questions — short and easy. Edit freely. */
const ICONS = {
  read:'<path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2V5z"/><path d="M4 19a2 2 0 012-2h13"/>',
  hand:'<path d="M12 21s-7-4.5-7-10a4 4 0 017-2.6A4 4 0 0119 11c0 5.5-7 10-7 10z"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 01-1 1H4a1 1 0 01-1-1z"/>',
  look:'<circle cx="12" cy="12" r="9"/>'
};
const QUESTIONS = [
  { id:"role", t:"What brings you here?", type:"pick", o:[["reader","Curious about faith words","read"],["pastor","Pastor or leader","hand"],["mentor","I review or mentor","eye"],["church","I run a church app","home"],["other","Just trying it","look"]] },
  { id:"easy", t:"How easy was it to use?", type:"five", o:["Hard","Bit hard","Okay","Easy","Very easy"] },
  { id:"useful", t:"Did it help you understand a word?", type:"pick", o:[["yes","Yes"],["some","A little"],["no","Not really"],["na","I didn't try"]] },
  { id:"fair", t:"Did it treat every tradition fairly?", type:"pick", o:[["yes","Yes"],["mostly","Mostly"],["no","No"],["unsure","Not sure"]] },
  { id:"push", t:"Did it feel pushy about any belief?", type:"pick", o:[["no","No"],["little","A little"],["yes","Yes"]] },
  { id:"feel", t:"Pick up to 3 words for how it felt.", type:"chips", max:3, o:["Calm","Clear","Curious","Safe","Beautiful","Slow","Confusing","Preachy","Boring","Too much"] },
  { id:"again", t:"Would you use it again?", type:"pick", o:[["yes","Yes"],["maybe","Maybe"],["no","No"]] },
  { id:"broken", t:"Anything broken or confusing?", help:"Optional. One line is plenty. Please leave out names and places.", type:"text", optional:true },
  { id:"email", t:"Can we follow up?", help:"Optional. Only to ask about your answer. Never shared, never marketing.", type:"email", optional:true }
];

/* =========================================================
   Engine — no need to edit below
   ========================================================= */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const icon = k => `<span class="oi"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k]}</svg></span>`;
const KEY = "ca_beta_survey_draft";
let i = 0, a = {};
try { const d = JSON.parse(sessionStorage.getItem(KEY)); if (d) { i = d.i || 0; a = d.a || {}; } } catch (e) {}
const keep = () => { try { sessionStorage.setItem(KEY, JSON.stringify({ i, a })); } catch (e) {} };
const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const PRIV = /(\b\d{7,}\b|@[a-z0-9.-]+\.[a-z]{2,})/i;
const CRISIS = /\b(kill myself|suicide|end my life|hurt myself)\b/i;

function valid() {
  const q = QUESTIONS[i], v = a[q.id];
  if (q.type === "email") return !v || EMAIL.test(v);
  if (q.optional) return true;
  if (q.type === "chips") return v && v.length > 0;
  return v !== undefined;
}
function draw() {
  const q = QUESTIONS[i], v = a[q.id];
  $("dots").innerHTML = QUESTIONS.map((_, j) => `<span class="dot${j === i ? " on" : j < i ? " done" : ""}"></span>`).join("");
  let body = "";
  if (q.type === "pick") body = `<div class="opts" role="group" aria-label="${esc(q.t)}">${q.o.map(([k, l, ik]) => `<button class="opt" data-v="${k}" aria-pressed="${v === k}">${ik ? icon(ik) : ""}${esc(l)}</button>`).join("")}</div>`;
  if (q.type === "five") body = `<div class="row5" role="group" aria-label="${esc(q.t)}">${q.o.map((l, j) => `<button class="opt" data-v="${j + 1}" aria-pressed="${v === j + 1}" aria-label="${j + 1}, ${esc(l)}"><b>${j + 1}</b>${esc(l)}</button>`).join("")}</div>`;
  if (q.type === "chips") { const s = v || []; body = `<div class="chips" role="group" aria-label="${esc(q.t)}">${q.o.map(w => `<button class="chip" data-v="${esc(w)}" aria-pressed="${s.includes(w)}" ${!s.includes(w) && s.length >= q.max ? "disabled" : ""}>${esc(w)}</button>`).join("")}</div>`; }
  if (q.type === "text") body = `<textarea id="ta" maxlength="280" aria-label="${esc(q.t)}" placeholder="e.g. The map was hard to read on my phone">${esc(v || "")}</textarea><div class="cnt" id="cn">${(v || "").length} / 280</div><p class="warn" id="w" hidden></p>`;
  if (q.type === "email") body = `<input id="em" type="email" inputmode="email" autocomplete="email" aria-label="Email" placeholder="you@example.com" value="${esc(v || "")}"><p class="warn" id="w" hidden>That email doesn't look right.</p>`;
  $("stage").innerHTML = `<div class="q"><div class="step">${i + 1} of ${QUESTIONS.length}</div><h1 tabindex="-1">${esc(q.t)}</h1>${q.help ? `<p class="help">${esc(q.help)}</p>` : ""}${body}${i === 0 ? `<p class="note">About 1 minute. No account. You can skip the last two.</p>` : ""}</div>`;
  $("back").hidden = i === 0;
  $("skip").hidden = !q.optional;
  $("next").textContent = i === QUESTIONS.length - 1 ? "Send" : "Next";
  $("next").disabled = !valid();
  const ta = $("ta");
  if (ta) ta.oninput = () => {
    a[q.id] = ta.value; $("cn").textContent = ta.value.length + " / 280";
    const w = $("w");
    if (CRISIS.test(ta.value)) { w.hidden = false; w.textContent = "If you are in danger, please call your local emergency number now."; }
    else if (PRIV.test(ta.value)) { w.hidden = false; w.textContent = "Please take out phone numbers or emails."; }
    else w.hidden = true;
    keep();
  };
  const em = $("em");
  if (em) em.oninput = () => { a[q.id] = em.value.trim(); $("w").hidden = !a[q.id] || EMAIL.test(a[q.id]); $("next").disabled = !valid(); keep(); };
  const h = $("stage").querySelector("h1"); h && h.focus({ preventScroll: true });
}
$("stage").onclick = e => {
  const b = e.target.closest("[data-v]"); if (!b) return;
  const q = QUESTIONS[i]; let v = b.dataset.v; if (q.type === "five") v = +v;
  if (q.type === "chips") { const s = a[q.id] || []; a[q.id] = s.includes(v) ? s.filter(x => x !== v) : [...s, v]; keep(); draw(); return; }
  a[q.id] = v; keep(); draw();
  setTimeout(() => { if (QUESTIONS[i] === q && a[q.id] === v && i < QUESTIONS.length - 1) { i++; keep(); draw(); } }, 360);
};
$("back").onclick = () => { if (i > 0) { i--; keep(); draw(); } };
$("skip").onclick = () => { delete a[QUESTIONS[i].id]; next(); };
$("next").onclick = () => next();
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.tagName !== "TEXTAREA" && !$("next").disabled && !$("bar").hidden) { e.preventDefault(); next(); } });

function next() {
  if (!valid()) return;
  if (i < QUESTIONS.length - 1) { i++; keep(); draw(); return; }
  send();
}
async function send() {
  const btn = $("next"); btn.disabled = true; btn.textContent = "Sending…";
  let broken = (a.broken || "").trim();
  const flagged = CRISIS.test(broken);
  if (PRIV.test(broken)) broken = broken.replace(/\b\d{7,}\b/g, "[number]").replace(/\S+@\S+/g, "[email]");
  const params = new URLSearchParams(location.search);
  const payload = {
    version: SURVEY_CONFIG.version,
    submittedAt: new Date().toISOString(),
    from: params.get("from") || document.referrer || null,  // link as survey.html?from=word-page
    device: /Mobi|Android/i.test(navigator.userAgent) ? "phone" : "desktop",
    lang: navigator.language || null,
    answers: { role:a.role, easy:a.easy, useful:a.useful, fair:a.fair, push:a.push, feel:a.feel || [], again:a.again, broken: broken || null, crisisFlag: flagged },
    email: a.email || null
  };
  let ok = true;
  if (SURVEY_CONFIG.endpoint) {
    try {
      const r = await fetch(SURVEY_CONFIG.endpoint, { method:"POST", credentials:"same-origin", headers:{ "Content-Type":"application/json", ...SURVEY_CONFIG.headers }, body: JSON.stringify(payload) });
      ok = r.ok;
    } catch (e) { ok = false; }
  }
  try { const L = JSON.parse(localStorage.getItem("ca_beta_survey") || "[]"); L.push({ ...payload, synced: !!SURVEY_CONFIG.endpoint && ok }); localStorage.setItem("ca_beta_survey", JSON.stringify(L)); } catch (e) {}
  if (!ok) { btn.disabled = false; btn.textContent = "Try again"; showErr(); return; }
  try { sessionStorage.removeItem(KEY); } catch (e) {}
  window.dispatchEvent(new CustomEvent("beta-survey:sent", { detail: payload }));
  if (window.parent !== window) window.parent.postMessage({ type: "beta-survey:sent", payload }, "*");
  $("bar").hidden = true; $("dots").innerHTML = "";
  $("stage").innerHTML = `<div class="done"><div class="step">Sent</div><h1 tabindex="-1">Thank you. That really helps.</h1><p class="note">Your answers were saved to our feedback file.</p><p class="hand">— the Rhema.ai team</p><div><a class="btn" href="${esc(SURVEY_CONFIG.appUrl)}">Back to the app</a></div></div>`;
  $("stage").querySelector("h1").focus();
}
function showErr() {
  let w = document.getElementById("sendErr");
  if (!w) { w = document.createElement("p"); w.id = "sendErr"; w.className = "warn"; w.setAttribute("role", "alert"); $("stage").querySelector(".q").appendChild(w); }
  w.textContent = "We couldn't send this. Your answers are kept. Check your connection and try again.";
}
draw();
</script>
</body>
</html>
