<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rhema.ai — Product tour</title>
<link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0;height:100%;background:#060806}a{color:#CFDA5C}a:hover{color:#E1E899}</style>
<script>window.OM_SCENES = '[{"name":"Opening","dur":3.5,"desc":"Rhema.ai title and One word. Three faiths."},{"name":"Dictionary","dur":7,"desc":"karma is typed and the word page builds with three tradition labels"},{"name":"Question","dur":6,"desc":"The monthly question is answered and sent with no name"},{"name":"Map","dur":6.5,"desc":"The map moves from August to September; new ideas turn lime"},{"name":"Pastor","dur":7,"desc":"Pastor home with the season ring and a daily check-in"},{"name":"Connect","dur":7,"desc":"Sign in to Planning Center; the row turns Connected; the other app is not available yet"},{"name":"Review","dur":7,"desc":"The review is prepared, then held for a person to decide"},{"name":"Promises","dur":8,"desc":"Four promises: no names, sources, a person decides, works offline"},{"name":"Close","dur":5,"desc":"Look up a word, then back to the title"}]';</script>
<script>(function(){var b=/(^|[#&])bare=1/.test(location.hash);try{b=b||window.self!==window.top}catch(e){b=true}window.TOUR_BARE=b;if(b)document.documentElement.classList.add('tour-bare');var fl=new URLSearchParams(location.search).get('from');if(fl==='landing'&&!b)document.documentElement.classList.add('tour-from-landing')})();</script>
<style>.tour-bare [data-omelette-chrome],.tour-bare .tour-home{display:none!important}.tour-from-landing [data-omelette-chrome]{display:none!important}.tour-pp{position:fixed;right:16px;bottom:16px;z-index:60;width:44px;height:44px;border-radius:999px;border:1px solid rgba(243,247,238,.18);background:rgba(11,15,12,.55);color:#F3F7EE;display:grid;place-items:center;cursor:pointer;opacity:.35;transition:opacity .2s ease,transform .12s ease,background .2s ease}.tour-pp:hover,.tour-pp:focus-visible{opacity:1;background:rgba(11,15,12,.8)}.tour-pp:active{transform:scale(.94)}.tour-pp:focus-visible{outline:2px solid #CFDA5C;outline-offset:2px}body:hover .tour-pp{opacity:.8}</style>
<script>window.OM_PLAYBACK = '{"mode":"loop"}';</script>
<script>const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{"motionEditor":true,"captions":true,"layout":"16:9"}/*EDITMODE-END*/;</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../public/data.js"></script>
</head><body><h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);margin:0">Rhema.ai product tour</h1><a class="tour-home" href="/" style="position:fixed;top:12px;left:12px;z-index:50;min-height:44px;display:inline-flex;align-items:center;gap:6px;padding:0 14px;border-radius:999px;background:rgba(0,0,0,.55);color:#f3efe6;font:600 14px/1 system-ui,sans-serif;text-decoration:none">← Home</a><template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100"><rect width="160" height="100" fill="#0B0F0C"/><rect x="100" y="18" width="36" height="64" rx="8" fill="#1A211B" stroke="#324034"/><path d="M114 42l12 8-12 8z" fill="#CFDA5C"/><text x="22" y="56" font-family="sans-serif" font-weight="800" font-size="16" fill="#F3F7EE">Tour</text></svg></template><div id="root"></div>
<script type="text/babel" src="animations-v3.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="Tour.jsx"></script>
<script type="text/babel">
function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const layout = new URLSearchParams(location.hash.slice(1)).get("layout") || t.layout;
  const V = layout === "9:16";
  const fromLanding = new URLSearchParams(location.search).get("from") === "landing" && !window.TOUR_BARE;
  return <>
    <CompositionStage key={layout} width={V ? 1080 : 1920} height={V ? 1920 : 1080} scenes={window.OM_SCENES} playback={window.OM_PLAYBACK} bg="#0B0F0C"><TourPiece captions={t.captions} vertical={V} /></CompositionStage>
    {!fromLanding && <TweaksPanel>
      <TweakToggle label="Motion editor" value={t.motionEditor} onChange={v => setTweak("motionEditor", v)} />
      <TweakRadio label="Layout" value={t.layout} options={["16:9", "9:16"]} onChange={v => setTweak("layout", v)} />
      <TweakToggle label="Captions" value={t.captions} onChange={v => setTweak("captions", v)} />
    </TweaksPanel>}
    {window.TOUR_BARE && <TourPause />}
    {fromLanding && <TourContinue />}
  </>;
}
function TourContinue() {
  const btn = (primary) => ({ minHeight: 44, padding: "0 18px", borderRadius: 999, display: "inline-flex", alignItems: "center", font: "700 15px/1 system-ui,sans-serif", textDecoration: "none", border: primary ? "0" : "1px solid rgba(243,247,238,.22)", background: primary ? "#CFDA5C" : "transparent", color: primary ? "#0B0F0C" : "#F3F7EE" });
  return <div role="region" aria-label="Next step" style={{ position: "fixed", bottom: 0, left: 0, right: 0, zIndex: 55, padding: "14px 16px calc(14px + env(safe-area-inset-bottom))", display: "flex", flexDirection: "column", gap: 10, alignItems: "center", background: "rgba(6,8,6,.94)", borderTop: "1px solid rgba(243,247,238,.12)" }}>
    <div style={{ display: "flex", gap: 10, justifyContent: "center", flexWrap: "wrap" }}>
      <a href="/search?guest=1" style={btn(true)}>Continue into the public app</a>
      <a href="/search?guest=1" style={btn(false)}>Skip — try the dictionary</a>
    </div>
    <span style={{ font: "600 12px/1.3 system-ui,sans-serif", color: "rgba(243,247,238,.55)" }}>Pastor or reviewer invite? <a href="/staff" style={{ color: "#CFDA5C" }}>Staff sign in</a> — not this tour.</span>
  </div>;
}
function TourPause() {
  const rm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const [on, setOn] = React.useState(true);
  const toggle = () => { window.dispatchEvent(new KeyboardEvent("keydown", { code: "Space", key: " " })); setOn(v => !v); };
  React.useEffect(() => { if (rm) setTimeout(toggle, 600); }, []);
  return <button type="button" className="tour-pp" onClick={toggle} aria-label={on ? "Pause tour" : "Play tour"} aria-pressed={!on}>
    {on ? <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      : <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>}
  </button>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body></html>
