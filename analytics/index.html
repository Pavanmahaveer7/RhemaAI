<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rhema.ai — Analytics</title>
  <link rel="stylesheet" href="/design/styles.css">
  <style>
    body { margin: 0; background: var(--ink-0, #0b0f0c); color: var(--text-body, #e8ece4); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font: 800 2.2rem/1.1 Georgia, serif; color: var(--text-strong, #f3f7ee); }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    td { padding: 10px 0; border-bottom: 1px solid var(--border-subtle, #324034); }
    td:last-child { text-align: right; font-weight: 700; }
    a { color: var(--lamp-400, #cfda5c); }
    .muted { color: var(--text-muted, #b8c4b8); font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <p><a href="/app#r=admin&as=admin">← Admin</a></p>
    <h1>Analytics</h1>
    <p class="muted">Admin only. Sign in as <strong>A-0100</strong> in the Reader app, then reload this page.</p>
    <table id="t"><tbody></tbody></table>
    <p id="err" class="muted" role="status"></p>
  </main>
  <script>
    fetch("/api/v1/admin/analytics?range=30d&region=all", { credentials: "same-origin" })
      .then(function (r) {
        if (r.status === 401 || r.status === 403) throw new Error("Sign in as admin (A-0100) at /staff or /app#r=signin&staff=l3 with admin code.");
        if (!r.ok) throw new Error("Could not load metrics.");
        return r.json();
      })
      .then(function (m) {
        var rows = [["Range", m.range], ["Region", m.region], ["Word views (events)", m.wordViews], ["Monthly answers", m.monthlyAnswers], ["Check-ins", m.checkins], ["Beta surveys", m.betaSurveys], ["Feedback items", m.feedbackItems], ["Waitlist", m.waitlist]];
        document.querySelector("#t tbody").innerHTML = rows.map(function (r) { return "<tr><td>" + r[0] + "</td><td>" + r[1] + "</td></tr>"; }).join("");
      })
      .catch(function (e) { document.getElementById("err").textContent = e.message || "Start run_local.ps1 first."; });
  </script>
</body>
</html>
