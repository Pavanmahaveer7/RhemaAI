[project]
name = "llm-gateway"
version = "0.1.0"
description = "Single entry for chat and embedding model calls. Local MiniLM embeddings are free."
requires-python = ">=3.12"
dependencies = ["guardrails", "fastembed"]

[tool.uv.sources]
guardrails = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
