[project]
name = "vocab-mcp"
version = "0.1.0"
description = "L1 vocab data access. lookup_term and search_terms."
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
