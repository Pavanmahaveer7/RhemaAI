<svg xmlns="http://www.w3.org/2000/svg" width="1020" viewBox="0 0 680 800" role="img"><title>Three-layer agentic AI architecture for the church platform, web version</title><desc>Blue is software engineering; teal, amber, gray and red are AI engineering.</desc>
