# Local development services (ADR-004). App processes run on the host during development.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: church_ai
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d church_ai"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  memgraph:
    image: memgraph/memgraph-mage:latest
    ports: ["7687:7687"]
    command: ["--also-log-to-stderr=true"]

  memgraph-lab:
    image: memgraph/lab:latest
    ports: ["3001:3000"]
    environment:
      QUICK_CONNECT_MG_HOST: memgraph
      QUICK_CONNECT_MG_PORT: "7687"
    depends_on: [memgraph]

  # Workflow automation for pastor layer (OTP, crisis routing, beta alerts). Start with profile n8n.
  n8n:
    profiles: ["n8n"]
    image: docker.n8n.io/n8nio/n8n:1.76.1
    ports: ["5678:5678"]
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: America/Chicago
      N8N_SECURE_COOKIE: "false"
    volumes: [n8n_data:/home/node/.n8n]
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
  n8n_data:
