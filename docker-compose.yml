# Local development services (ADR-004). App processes run on the host during development.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: church_ai
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d church_ai"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  memgraph:
    image: memgraph/memgraph-mage:latest
    ports: ["7687:7687"]
    command: ["--also-log-to-stderr=true"]

  memgraph-lab:
    image: memgraph/lab:latest
    ports: ["3001:3000"]
    environment:
      QUICK_CONNECT_MG_HOST: memgraph
      QUICK_CONNECT_MG_PORT: "7687"
    depends_on: [memgraph]

volumes:
  pgdata:
