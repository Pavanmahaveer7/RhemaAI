<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>X-ray · mobile</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px 20px 60px;background:var(--surface-page);color:var(--text-body);font:15px/1.45 var(--font-body)}h1{font:800 32px/1 var(--font-display);color:var(--text-strong);margin:0 0 6px}table{border-collapse:collapse;width:100%;max-width:1200px;margin-top:14px}td,th{padding:7px 10px;border-bottom:1px solid var(--border-subtle);text-align:left;vertical-align:top}th{color:var(--text-muted);font-weight:600}.ok{color:var(--ok-400);font-weight:700}.no{color:var(--danger-400);font-weight:700}code{font:12px/1.4 var(--font-mono)}.lay{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}.v{flex:none;width:390px;height:844px;border:1px solid var(--border-subtle);border-radius:var(--radius-md);overflow:hidden;background:#000}#f{width:390px;height:844px;border:0}button.r{background:none;border:0;color:var(--lamp-400);font:600 13px var(--font-body);cursor:pointer;padding:0;min-height:44px;text-align:left}a{color:var(--lamp-400)}a:hover{color:var(--lamp-300)}</style></head>
<body><h1>X-ray · mobile 390 × 844</h1><p>Every box outlined. Checks: page scrolls sideways, element runs off screen, text clipped, text boxes overlapping, unequal left/right gutter. Click a screen name to x-ray it on the left.</p><div id="sum">Running…</div>
<div class="lay"><div class="v"><iframe id="f"></iframe></div><div style="flex:1;min-width:300px;overflow-x:auto"><table><thead><tr><th>Screen</th><th>Side-scroll</th><th>Off screen</th><th>Clipped</th><th>Overlap / under bar</th><th>Gutter</th><th>Where</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<script>
const P="public/index.html#",Q="pipeline/index.html#";
const R=[["Landing","landing/index.html"],["Search",P+"r=search"],["Guest search",P+"r=search&guest=1"],["Word karma",P+"r=term&t=karma"],["Word missing",P+"r=term&t=zzzz"],["Monthly",P+"r=month"],["Monthly closed",P+"r=month&closed=1"],["Map",P+"r=graph"],["Onboarding 1",P+"r=intro&step=1"],["Onboarding 2",P+"r=intro&step=2"],["Onboarding 3",P+"r=intro&step=3"],["Onboarding 4",P+"r=intro&step=4"],["Welcome",P+"r=welcome"],["Sign in",P+"r=signin"],["Settings",P+"r=settings&as=member"],["States",P+"r=states"],["Admin accounts",P+"r=admin&tab=accounts&as=admin"],["Admin map draft",P+"r=admin&tab=map&as=admin"],["Admin draft map",P+"r=admin&tab=draftmap&as=admin"],["Pastor home",Q+"r=home&pco=on"],["Check-in",Q+"r=checkin"],["Result steady",Q+"r=result&ck=steady"],["Result hard",Q+"r=result&ck=hard"],["Tracks",Q+"r=tracks&pco=on"],["Pack",Q+"r=pack&pco=on"],["Church apps",Q+"r=integrations&pco=off"],["Sign-in PCO",Q+"r=signin"],["Connected church",Q+"r=church&pco=on"],["Inside church app",Q+"r=embed"],["Register",Q+"r=register"],["Reviewer queue",Q+"role=reviewer&r=queue"],["Packet",Q+"role=reviewer&r=review&id=P-0419"],["Alerts",Q+"role=leader&r=alerts"],["Tour","tour/index.html"]];
const QW=+new URLSearchParams(location.search).get("w")||390,QH=QW>=1000?800:844;document.querySelector("h1").textContent=QW>=1000?"X-ray · desktop "+QW+" × "+QH:"X-ray · mobile 390 × 844";
const F=document.getElementById("f");F.style.width=QW+"px";F.style.height=QH+"px";F.parentElement.style.width=QW+"px";F.parentElement.style.height=QH+"px";if(QW>=1000){F.parentElement.style.transform="scale(.45)";F.parentElement.style.transformOrigin="0 0";F.parentElement.style.marginBottom=-QH*.55+"px";F.parentElement.style.marginRight=-QW*.55+"px"}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const XCSS='*{outline:1px solid rgba(255,80,80,.55)!important;outline-offset:-1px}*:is(p,h1,h2,h3,span,a,button,label,li){outline-color:rgba(80,200,255,.7)!important}';
function xray(on){try{const d=F.contentDocument;let s=d.getElementById("__xr");if(on&&!s){s=d.createElement("style");s.id="__xr";s.textContent=XCSS;d.head.appendChild(s)}if(!on&&s)s.remove()}catch(e){}}
async function load(u){await new Promise(r=>{F.onload=r;F.src="about:blank"});await new Promise(r=>{F.onload=r;F.src=u;setTimeout(r,8000)});const t0=Date.now();while(Date.now()-t0<8000){try{if(F.contentDocument.body.innerText.trim().length>40)break}catch(e){}await sleep(150)}await sleep(2200);if(QW<1000)try{F.contentDocument.documentElement.setAttribute("data-touch","")}catch(e){}await sleep(250)}
function scan(){const w=F.contentWindow,d=F.contentDocument,W=w.innerWidth,o={x:[],off:[],clip:[],ov:[],g:[]};
 const vis=e=>{const r=e.getBoundingClientRect(),cs=w.getComputedStyle(e);return r.width>1&&r.height>1&&!(cs.position==="absolute"&&/rect\(0/.test(cs.clip))&&cs.visibility!=="hidden"&&+cs.opacity>0.05&&!e.closest('[aria-hidden="true"],svg,canvas')};
 const pinned=e=>{for(let p=e;p&&p!==d.body;p=p.parentElement){const ps=w.getComputedStyle(p).position;if(ps==="fixed"||ps==="sticky")return true}return false};
 const inScroller=e=>{for(let p=e.parentElement;p&&p!==d.body;p=p.parentElement){const cs=w.getComputedStyle(p);if(/(auto|scroll|hidden|clip)/.test(cs.overflowX)&&p.scrollWidth>p.clientWidth+1)return true;if(cs.position==="fixed"&&/hidden|clip/.test(cs.overflow))return true}return false};
 const lbl=e=>((e.innerText||e.getAttribute("aria-label")||e.tagName).trim().replace(/\s+/g," ").slice(0,26));
 if(d.documentElement.scrollWidth>W+1)o.x.push(`page ${d.documentElement.scrollWidth}px wide`);
 const all=[...d.body.querySelectorAll("*")].filter(vis);
 all.forEach(e=>{const r=e.getBoundingClientRect();if((r.right>W+1||r.left<-1)&&!inScroller(e)&&!pinned(e)&&r.width<W*3)o.off.push(`${lbl(e)} ${Math.round(r.left)}→${Math.round(r.right)}`);
  const cs=w.getComputedStyle(e);if(e.childNodes.length&&[...e.childNodes].some(n=>n.nodeType===3&&n.textContent.trim())&&/(hidden|clip)/.test(cs.overflowX+cs.overflowY)&&cs.textOverflow!=="ellipsis"&&!/-webkit-box/.test(cs.display)&&(e.scrollWidth>e.clientWidth+2||e.scrollHeight>e.clientHeight+3)&&!(e.clientWidth<=1))o.clip.push(lbl(e))});
 const txt=all.filter(e=>[...e.childNodes].some(n=>n.nodeType===3&&n.textContent.trim().length>1)&&!pinned(e)).map(e=>{const rg=d.createRange();rg.selectNodeContents(e);const cs2=w.getComputedStyle(e),bx=e.getBoundingClientRect(),cl=/(hidden|clip)/.test(cs2.overflowX+cs2.overflowY);const rr=[...rg.getClientRects()].map(q=>cl?{left:Math.max(q.left,bx.left),right:Math.min(q.right,bx.right),top:Math.max(q.top,bx.top),bottom:Math.min(q.bottom,bx.bottom)}:q).filter(q=>q.right-q.left>1&&q.bottom-q.top>1);return {e,rr}}).filter(t=>t.rr.length);
 for(let i=0;i<txt.length;i++)for(let j=i+1;j<txt.length;j++){const A=txt[i],B=txt[j];if(A.e.contains(B.e)||B.e.contains(A.e))continue;let hit=false;for(const a of A.rr){for(const b of B.rr){const ix=Math.min(a.right,b.right)-Math.max(a.left,b.left),iy=Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top);const sm=Math.min((a.right-a.left)*(a.bottom-a.top),(b.right-b.left)*(b.bottom-b.top));if(ix>3&&iy>3&&ix*iy>sm*0.3){hit=true;break}}if(hit)break}if(hit&&o.ov.length<8)o.ov.push(`“${lbl(A.e)}” × “${lbl(B.e)}”`)}
 const blocks=all.filter(e=>/^(P|H1|H2|H3|LI|LABEL)$/.test(e.tagName)&&!inScroller(e)&&!pinned(e)).map(e=>[e,e.getBoundingClientRect()]).filter(([,r])=>r.width>W*0.5);
 if(blocks.length&&QW<1000){const L=Math.min(...blocks.map(([,r])=>r.left)),mx=blocks.reduce((m,b)=>b[1].right>m[1].right?b:m),Rr=W-mx[1].right;if(L<12)o.g.push(`left ${Math.round(L)}px`);if(Rr<12)o.g.push(`right ${Math.round(Rr)}px “${lbl(mx[0])}”`);if(Math.abs(L-Rr)>16&&Rr>=0)o.g.push(`L ${Math.round(L)} ≠ R ${Math.round(Rr)} (widest: “${lbl(mx[0])}”)`)}
 {const bars=[...d.body.querySelectorAll("nav,form,div")].filter(e=>w.getComputedStyle(e).position==="fixed"&&vis(e)).map(e=>e.getBoundingClientRect()).filter(r=>r.top>w.innerHeight*0.6&&r.width>W*0.8);if(bars.length){const top=Math.min(...bars.map(r=>r.top));w.scrollTo(0,1e6);const se=d.scrollingElement;const last=txt.map(t=>t.e).filter(e=>!pinned(e)).map(e=>e.getBoundingClientRect().bottom);const lb=last.length?Math.max(...last):0;if(se.scrollHeight>w.innerHeight+2&&lb>top+2)o.ov.push(`last text hidden under bottom bar by ${Math.round(lb-top)}px`);w.scrollTo(0,0)}}
 Object.keys(o).forEach(k=>o[k]=[...new Set(o[k])]);return o}
window.show=async i=>{await load(R[i][1]);xray(true)};
(async()=>{const tb=document.getElementById("rows"),res=[];let clean=0;
 for(let i=0;i<R.length;i++){const [n,u]=R[i];await load(u);let o;try{o=scan()}catch(e){o={x:["scan error "+e.message],off:[],clip:[],ov:[],g:[]}}xray(true);await sleep(150);
  const bad=o.x.length+o.off.length+o.clip.length+o.ov.length+o.g.length;if(!bad)clean++;res.push([n,o]);
  const c=a=>`<td class="${a.length?"no":"ok"}">${a.length||"Pass"}</td>`;const tr=document.createElement("tr");
  tr.innerHTML=`<td><button class="r" onclick="show(${i})">${n}</button></td>${c(o.x)}${c(o.off)}${c(o.clip)}${c(o.ov)}${c(o.g)}<td><code>${[...o.x,...o.off.slice(0,2),...o.clip.slice(0,2),...o.ov.slice(0,2),...o.g].join(" · ").replace(/</g,"&lt;")}</code></td>`;tb.appendChild(tr);
  document.getElementById("sum").textContent=`${res.length}/${R.length} screens…`}
 document.getElementById("sum").textContent=`${clean} / ${R.length} screens clean in x-ray`;window.__xray=res;})();
</script></body></html>
