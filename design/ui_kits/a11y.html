<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Phone, keyboard, contrast</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--surface-page);color:var(--text-body);font:15px/1.4 var(--font-body)}h1{font:800 32px/1 var(--font-display);color:var(--text-strong);margin:0 0 6px}table{border-collapse:collapse;width:100%;max-width:1300px;margin-top:16px}td,th{padding:7px 10px;border-bottom:1px solid var(--border-subtle);text-align:left;vertical-align:top}th{color:var(--text-muted)}.ok{color:var(--ok-400);font-weight:700}.no{color:var(--danger-400);font-weight:700}code{font:12px var(--font-mono)}#f{position:absolute;left:-9999px;top:0;width:390px;height:844px;border:0}a{color:var(--lamp-400)}a:hover{color:var(--lamp-300)}</style></head>
<body><h1>Phone, keyboard, contrast</h1><p>Every screen at 390 px. Phone: no sideways scroll. Keyboard: every button and link has a name and can take focus. Contrast: body text ≥ 4.5:1, large text ≥ 3:1.</p><div id="sum">Running…</div><table><thead><tr><th>Screen</th><th>Phone</th><th>Keyboard</th><th>Contrast</th><th>Detail</th></tr></thead><tbody id="rows"></tbody></table><iframe id="f"></iframe>
<script>
addEventListener("hashchange",()=>location.reload());
const P="public/index.html#",Q="pipeline/index.html#";
const R=[["Landing","landing/index.html"],["Search",P+"r=search"],["Word karma",P+"r=term&t=karma"],["Word missing",P+"r=term&t=zzzz"],["Monthly",P+"r=month"],["Map",P+"r=graph"],["Onboarding 1",P+"r=intro&step=1"],["Onboarding 4",P+"r=intro&step=4"],["Welcome",P+"r=welcome"],["Sign in",P+"r=signin"],["Settings",P+"r=settings&as=member"],["Admin accounts",P+"r=admin&tab=accounts&as=admin"],["Admin map draft",P+"r=admin&tab=map&as=admin"],["Admin draft map",P+"r=admin&tab=draftmap&as=admin"],["Pastor home",Q+"r=home&pco=on"],["Check-in",Q+"r=checkin"],["Result hard",Q+"r=result&ck=hard"],["Tracks",Q+"r=tracks&pco=on"],["Pack",Q+"r=pack&pco=on"],["Church apps",Q+"r=integrations&pco=off"],["Connected church",Q+"r=church&pco=on"],["Inside church app",Q+"r=embed"],["Reviewer queue",Q+"role=reviewer&r=queue"],["Packet",Q+"role=reviewer&r=review&id=P-0419"],["Alerts",Q+"role=leader&r=alerts"]];
const F=document.getElementById("f"),sleep=ms=>new Promise(r=>setTimeout(r,ms));
// Computed colours can be color(srgb 0–1), oklch or color-mix, so a canvas converts them to 0–255.
const px=document.createElement("canvas").getContext("2d",{willReadFrequently:true});
const rgb=s=>{if(!s||s==="transparent")return [0,0,0,0];px.clearRect(0,0,1,1);px.fillStyle="rgba(0,0,0,0)";px.fillStyle=s;px.fillRect(0,0,1,1);const d=px.getImageData(0,0,1,1).data;return [d[0],d[1],d[2],d[3]/255]};
const lum=([r,g,b])=>{const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(r)+.7152*f(g)+.0722*f(b)};
const ratio=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
function bgOf(el,w){const on=el.closest("[role=radio][aria-checked=true]"),th=on&&on.parentElement.querySelector(":scope>span[aria-hidden=true]");if(th){const c=rgb(w.getComputedStyle(th).backgroundColor);if(c[3]>0.9)return c}let e=el;while(e&&e.nodeType===1){const cs=w.getComputedStyle(e);if(cs.backgroundImage&&cs.backgroundImage!=="none")return null;const c=rgb(cs.backgroundColor);if((c[3]===undefined||c[3]>0.9)&&cs.backgroundColor!=="transparent")return c;e=e.parentElement}return [11,10,9]}
function audit(w,d){const out={over:0,unnamed:[],unfocus:0,low:[]};
 out.over=Math.max(d.documentElement.scrollWidth,d.body.scrollWidth)-w.innerWidth;
 d.querySelectorAll("button,a[href],[role=button],input,textarea,select").forEach(el=>{const r=el.getBoundingClientRect();if(!r.width||!r.height)return;const shut=el.closest("details:not([open])");if(shut&&!el.closest("summary"))return;const nm=(el.getAttribute("aria-label")||el.innerText||el.title||el.getAttribute("placeholder")||(el.labels&&el.labels[0]&&el.labels[0].innerText)||el.getAttribute("aria-labelledby")||"").trim();if(!nm&&!el.querySelector("img[alt]"))out.unnamed.push(el.tagName.toLowerCase()+(el.className&&typeof el.className==="string"?"."+el.className.split(" ")[0]:""));if(el.tabIndex<0&&!el.disabled)out.unfocus++});
 const walker=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT);const seen=new Set();let n;
 while(n=walker.nextNode()){const t=n.textContent.trim();if(t.length<2)continue;const el=n.parentElement;if(!el||seen.has(el))continue;seen.add(el);const r=el.getBoundingClientRect();if(!r.width||!r.height)continue;const cs=w.getComputedStyle(el);if(cs.visibility==="hidden"||+cs.opacity<.5)continue;if(el.closest("[aria-hidden=true],svg,[disabled]"))continue;const bg=bgOf(el,w);if(!bg)continue;const fg=rgb(cs.color);if(fg[3]!==undefined&&fg[3]<1)fg.splice(0,3,...fg.slice(0,3).map((v,i)=>v*fg[3]+bg[i]*(1-fg[3])));const fs=parseFloat(cs.fontSize),bold=+cs.fontWeight>=700;const need=(fs>=24||(fs>=18.66&&bold))?3:4.5;const cr=ratio(fg,bg);if(cr<need)out.low.push(`“${t.slice(0,28)}” ${cr.toFixed(2)}:1 (needs ${need})`)}
 return out}
(async()=>{const tb=document.getElementById("rows");let pp=0,kp=0,cp=0;const all=[];
for(const [name,u] of R){await new Promise(r=>{F.onload=r;F.src="about:blank"});await new Promise(r=>{F.onload=r;F.src=u;setTimeout(r,8000)});await sleep(3000);let a;try{a=audit(F.contentWindow,F.contentDocument)}catch(e){a={over:0,unnamed:["error "+e.message],unfocus:0,low:[]}}
 const ph=a.over<=1,kb=!a.unnamed.length&&!a.unfocus,co=!a.low.length;pp+=ph;kp+=kb;cp+=co;all.push({name,...a});
 const det=[!ph&&`sideways scroll ${a.over}px`,a.unnamed.length&&`no name: ${a.unnamed.slice(0,3).join(", ")}`,a.unfocus&&`${a.unfocus} not focusable`,a.low.length&&`low contrast ×${a.low.length}: ${a.low.slice(0,2).join(" · ")}`].filter(Boolean).join(" | ")||"clean";
 const c=b=>`<td class="${b?"ok":"no"}">${b?"Pass":"Fail"}</td>`;const tr=document.createElement("tr");tr.innerHTML=`<td>${name}</td>${c(ph)}${c(kb)}${c(co)}<td><code>${det.replace(/</g,"&lt;")}</code></td>`;tb.appendChild(tr)}
document.getElementById("sum").textContent=`Phone ${pp}/${R.length} · Keyboard ${kp}/${R.length} · Contrast ${cp}/${R.length}`;window.__a11y=all;})();
</script></body></html>
